name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # TensorFlow is deliberately excluded: the tested code paths (metrics,
      # data loading, config, preprocessing) are pure NumPy/PIL, so CI stays
      # fast and does not need a heavy install.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt --no-deps
          pip install numpy pillow pydantic PyYAML typer matplotlib pytest ruff

      - name: Lint
        run: ruff check src tests

      - name: Test
        env:
          PYTHONPATH: src
        run: pytest -q
